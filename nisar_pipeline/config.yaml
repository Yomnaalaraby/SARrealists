# Configuration for NASA-ISRO NISAR Web Visualization Pipeline
raw_dir: "/content/nisar_raw"
out_dir: "out"

streaming:
  block_size_mb: 4
  sock_connect_timeout: 60
  sock_read_timeout: 900
  max_retries: 6
  retry_sleep_sec: 10
  download_max_retries: 30
  download_chunk_mb: 8

gcov_defaults:
  invalid_mask_values: [0, 255]

gunw_defaults:
  wavelength_m: 0.24
  coherence_threshold: 0.4
  min_dates_for_rate: 3

sites:
  california:
    title: "California Wildfires (Malibu / Palisades / Santa Monica Mtns to Eaton)"
    bbox: [-118.80, 33.98, -118.00, 34.30]
    start: "2025-10-01"
    end: "2026-12-31"
    looks: 4
    flat_terrain: false
    known_tracks:
      - { track: 13, direction: "D" }
      - { track: 114, direction: "D" }
      - { track: 34, direction: "A" }
    reference_box: [-118.45, 34.02, -118.35, 34.08]
    sample_points:
      - { id: "cal_palisades_core", lon: -118.545, lat: 34.075 }
      - { id: "cal_eaton_canyon", lon: -118.120, lat: 34.185 }
      - { id: "cal_unburned_ref", lon: -118.400, lat: 34.050 }

  nile_delta:
    title: "Whole Nile Delta (Cairo Apex to Mediterranean, Alexandria to Port Said)"
    bbox: [29.85, 30.00, 32.25, 31.60]
    expected_epsg: 32636
    start: "2025-10-01"
    end: "2026-12-31"
    looks: 8
    flat_terrain: true
    coherence_threshold: 0.4
    reference_box: [31.10, 30.40, 31.25, 30.55]
    sample_points:
      - { id: "nile_mansoura_ag", lon: 31.380, lat: 31.040 }
      - { id: "nile_kafr_el_sheikh", lon: 30.940, lat: 31.110 }
      - { id: "nile_coastal_sub", lon: 31.450, lat: 31.420 }
      - { id: "nile_south_apex", lon: 31.180, lat: 30.450 }

  himalaya:
    title: "Himalayan Glaciers (Greater Gangotri, Bhagirathi & Satopanth System)"
    bbox: [78.75, 30.65, 79.45, 31.25]
    expected_epsg: 32644
    start: "2025-10-01"
    end: "2026-12-31"
    looks: 4
    flat_terrain: false
    rgi_geojson: null
    reference_box: [78.85, 30.75, 78.95, 30.85]
    sample_points:
      - { id: "gangotri_snout", lon: 79.080, lat: 30.925 }
      - { id: "gangotri_mid_trunk", lon: 79.160, lat: 30.840 }
      - { id: "gangotri_upper_acc", lon: 79.240, lat: 30.760 }

color_ranges:
  hh_db:
    title: "Surface Roughness & Moisture (HH Co-Pol)"
    units: "dB"
    vmin: -22.0
    vmax: 0.0
    cmap: "gray"
  hv_db:
    title: "Vegetation & Canopy Density (HV Cross-Pol)"
    units: "dB"
    vmin: -30.0
    vmax: -8.0
    cmap: "YlGn"
  pol_ratio_db:
    title: "Canopy-to-Surface Scattering Ratio (HV/HH)"
    units: "dB"
    vmin: -15.0
    vmax: -2.0
    cmap: "viridis"
  rvi:
    title: "Radar Vegetation Health Index (Dual-Pol RVI)"
    units: "unitless"
    vmin: 0.0
    vmax: 1.0
    cmap: "YlGn"
  freq_diff_db:
    title: "Dual-Frequency Difference (Freq A - Freq B)"
    units: "dB"
    vmin: -4.0
    vmax: 4.0
    cmap: "coolwarm"
  rgb_composite:
    title: "Polarimetric SAR RGB Composite (R=HH, G=HV, B=RVI)"
    units: "uint8_rgb"
    vmin: 0.0
    vmax: 255.0
    cmap: "rgb"
  hv_db_change:
    title: "Wildfire Burn & Canopy Change (Post - Pre HV)"
    units: "dB"
    vmin: -6.0
    vmax: 6.0
    cmap: "RdBu"
  hh_db_change:
    title: "Surface Moisture & Flood Change (Post - Pre HH)"
    units: "dB"
    vmin: -6.0
    vmax: 6.0
    cmap: "RdBu"
  rvi_change:
    title: "Biomass & Crop Cover Change (Post - Pre RVI)"
    units: "unitless"
    vmin: -0.4
    vmax: 0.4
    cmap: "RdBu"
  coherence:
    title: "Interferometric Surface Stability (Coherence)"
    units: "unitless"
    vmin: 0.0
    vmax: 1.0
    cmap: "magma"
  los_disp_mm:
    title: "Ground Sinking / Uplift Along Radar Beam"
    units: "mm"
    vmin: -100.0
    vmax: 100.0
    cmap: "RdBu_r"
  vert_disp_mm:
    title: "Vertical Land Subsidence"
    units: "mm"
    vmin: -120.0
    vmax: 120.0
    cmap: "RdBu_r"
  disp_rate_mm_yr:
    title: "Annual Land Sinking Speed"
    units: "mm/yr"
    vmin: -50.0
    vmax: 50.0
    cmap: "RdBu_r"
  velocity_m_yr:
    title: "Glacier Ice Flow Speed"
    units: "m/yr"
    vmin: 0.0
    vmax: 150.0
    cmap: "plasma"
  soil_moisture:
    title: "Root-Zone Volumetric Soil Moisture"
    units: "m3/m3"
    vmin: 0.02
    vmax: 0.50
    cmap: "YlGnBu"